<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Okey 101 için el el skor tutan yaz boz uygulaması.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Yaz Boz">
<meta name="theme-color" content="#EFF1EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131A17" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23131A17'/%3E%3Crect x='34' y='26' width='112' height='128' rx='16' fill='%23E7E1D3'/%3E%3Ctext x='90' y='108' font-family='Helvetica,Arial,sans-serif' font-size='58' font-weight='700' text-anchor='middle' fill='%23B8342B'%3E101%3C/text%3E%3C/svg%3E">
<style>*{-webkit-user-select:none;user-select:none}input{-webkit-user-select:text;user-select:text}</style>
</head>
<body>
<title>Okey 101 Yaz Boz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400..700&display=swap">

<style>
/* ---------- tokens ---------- */
:root{
  --bg:#EFF1EC; --surface:#F9FAF7; --surface-2:#E4E8E0; --sunken:#DCE1D7;
  --line:#CFD6CA; --line-soft:#DEE3D9;
  --text:#161C18; --muted:#5C6A62; --faint:#8A968E;
  --tile-bg:#1C221E; --tile-hi:#333C36; --tile-edge:#0B0F0C; --tile-text:#F2EFE6;
  --suit-0:#B8342B; --suit-1:#1B5798; --suit-2:#8F6200; --suit-3:#20261F;
  --good:#2C7A4B; --bad:#B8342B;
  --focus:#1B5798;
  --shadow:0 1px 2px rgba(20,30,24,.06), 0 8px 24px rgba(20,30,24,.07);
  --sheet-shadow:0 -8px 40px rgba(20,30,24,.22);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131A17; --surface:#1B2320; --surface-2:#232C28; --sunken:#151C19;
    --line:#2E3A35; --line-soft:#252E2A;
    --text:#E9EDE9; --muted:#8E9C95; --faint:#6C7A73;
    --tile-bg:#E7E1D3; --tile-hi:#FBF7EC; --tile-edge:#B4AE9E; --tile-text:#141A16;
    --suit-0:#F2685C; --suit-1:#62A8F0; --suit-2:#E7B93F; --suit-3:#D6DED8;
    --good:#5BC38A; --bad:#F2685C;
    --focus:#62A8F0;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.34);
    --sheet-shadow:0 -8px 44px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#131A17; --surface:#1B2320; --surface-2:#232C28; --sunken:#151C19;
  --line:#2E3A35; --line-soft:#252E2A;
  --text:#E9EDE9; --muted:#8E9C95; --faint:#6C7A73;
  --tile-bg:#E7E1D3; --tile-hi:#FBF7EC; --tile-edge:#B4AE9E; --tile-text:#141A16;
  --suit-0:#F2685C; --suit-1:#62A8F0; --suit-2:#E7B93F; --suit-3:#D6DED8;
  --good:#5BC38A; --bad:#F2685C;
  --focus:#62A8F0;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.34);
  --sheet-shadow:0 -8px 44px rgba(0,0,0,.55);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:"Instrument Sans","Segoe UI",system-ui,sans-serif;
  font-size:16px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none;
  display:flex; flex-direction:column; min-height:100dvh;
}
button,input,textarea{font:inherit; color:inherit}
button{cursor:pointer; touch-action:manipulation}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px; border-radius:6px}
h1,h2,h3{margin:0; font-family:"Bricolage Grotesque","Instrument Sans",sans-serif; font-weight:700; text-wrap:balance}

/* ---------- tile motif ---------- */
.tile{
  background:linear-gradient(180deg,var(--tile-hi),var(--tile-bg) 46%);
  color:var(--tile-text);
  border-radius:12px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35), 0 2px 0 var(--tile-edge), 0 6px 16px rgba(0,0,0,.25);
  border:none;
}
.tile:active{transform:translateY(2px); box-shadow:inset 0 1px 0 rgba(255,255,255,.3), 0 0 0 var(--tile-edge), 0 3px 8px rgba(0,0,0,.25)}

/* ---------- chrome ---------- */
.topbar{
  position:sticky; top:0; z-index:20;
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  background:var(--bg);
  border-bottom:1px solid var(--line-soft);
}
.brand{display:flex; align-items:center; gap:9px; min-width:0}
.brand-mark{
  display:grid; place-items:center; width:34px; height:34px; flex:none;
  font-family:"Bricolage Grotesque",sans-serif; font-weight:800; font-size:14px; letter-spacing:-.02em;
}
.brand-text{font-family:"Bricolage Grotesque",sans-serif; font-weight:700; font-size:17px; letter-spacing:-.01em; white-space:nowrap}
.brand-sub{font-size:12px; color:var(--faint); white-space:nowrap}
.icon-btn{
  width:38px; height:38px; flex:none; display:grid; place-items:center;
  background:var(--surface); border:1px solid var(--line); border-radius:10px; color:var(--muted);
}
.icon-btn:active{background:var(--surface-2)}

main{flex:1; padding:14px 16px 8px; display:flex; flex-direction:column; gap:14px; width:100%; max-width:640px; margin:0 auto}

.actionbar{
  position:sticky; bottom:0; z-index:20;
  padding:8px 16px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(to top, var(--bg) 68%, transparent);
  width:100%; max-width:640px; margin:0 auto;
  display:flex; flex-direction:column; gap:7px;
}
.next-dealer{
  text-align:center; font-size:12px; color:var(--faint); letter-spacing:.01em;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.next-dealer b{color:var(--muted); font-weight:600}
.btn-primary{
  width:100%; padding:16px; font-family:"Bricolage Grotesque",sans-serif;
  font-weight:700; font-size:17px; letter-spacing:-.01em;
}

/* ---------- standings ---------- */
.standings-wrap{display:flex; flex-direction:column; gap:8px}
.sec-label{
  display:flex; align-items:baseline; gap:7px; padding-left:3px;
  font-size:10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--faint);
}
.sec-label em{font-style:normal; font-weight:400; font-size:11px; letter-spacing:0; text-transform:none; opacity:.8}
.standings{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
.standings.two{grid-template-columns:repeat(2,1fr)}
.ptile{
  position:relative; padding:11px 6px 9px; border-radius:12px; text-align:center;
  display:flex; flex-direction:column; justify-content:center;
  background:var(--surface); border:1px solid var(--line);
  box-shadow:var(--shadow); overflow:hidden;
}
.ptile::before{content:""; position:absolute; inset:0 0 auto; height:3px; background:var(--suit)}
.ptile.lead{border-color:var(--suit)}
.ptile-name{
  font-size:11.5px; font-weight:600; color:var(--suit);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px;
}
.ptile-total{
  font-family:"Bricolage Grotesque",sans-serif; font-weight:800;
  font-size:clamp(20px,6.4vw,27px); letter-spacing:-.03em; line-height:1.15;
  font-variant-numeric:tabular-nums; margin-top:1px;
}
.ptile-sub{font-size:9.5px; color:var(--faint); font-variant-numeric:tabular-nums; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.ptile-sub i{font-style:normal; opacity:.6; padding:0 1px}
.two .ptile{padding:13px 10px 11px}
.two .ptile-name{font-size:13.5px}
.two .ptile-total{font-size:clamp(28px,9vw,38px)}
.two .ptile-sub{font-size:11px}
.lead-flag{
  display:block; margin-top:3px; font-size:8.5px; font-weight:700;
  letter-spacing:.09em; text-transform:uppercase; color:var(--suit);
}
.two .lead-flag{font-size:9.5px}

/* ---------- cards ---------- */
.card{background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); overflow:hidden}
.card-head{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 14px 10px}
.card-head h2{font-size:14px; letter-spacing:-.01em}
.card-head .hint{font-size:11.5px; color:var(--faint); text-align:right}
.seg{display:flex; gap:6px; flex:none}
.seg button{
  padding:7px 11px; font-size:12.5px; font-weight:600;
  background:var(--surface-2); border:1px solid var(--line); border-radius:9px; color:var(--text);
  white-space:nowrap;
}
.seg button:active{background:var(--sunken)}

/* ---------- score grid ---------- */
.gridwrap{overflow-x:auto}
table{width:100%; border-collapse:collapse; table-layout:fixed}
thead th{
  padding:6px 4px 8px; font-size:10.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
  color:var(--faint); border-bottom:1px solid var(--line); text-align:center;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
thead th.p{color:var(--suit); text-transform:none; font-size:11.5px; letter-spacing:0}
thead th.el{width:104px; text-align:left; padding-left:12px}
tbody tr{border-bottom:1px solid var(--line-soft)}
tbody tr[data-hand]:active{background:var(--surface-2)}
tbody td{padding:10px 4px; text-align:center; font-size:15px; font-variant-numeric:tabular-nums;
  font-family:"DM Mono",ui-monospace,monospace}
tbody td.el{text-align:left; padding-left:12px; font-family:"Instrument Sans",sans-serif; line-height:1.3}
tbody td.el b{display:block; font-size:12px; font-weight:500; color:var(--muted)}
tbody td.el .dlr{
  display:block; font-size:10px; color:var(--faint); font-weight:400;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
tbody td.neg{color:var(--good)}
tfoot td{
  padding:8px 4px; text-align:center; font-size:13px; font-weight:400;
  font-family:"DM Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums;
  background:var(--surface-2); color:var(--muted);
}
tfoot tr:first-child td{border-top:1px solid var(--line); padding-top:11px}
tfoot tr.grand td{
  font-size:15.5px; font-weight:500; color:var(--text); padding:9px 4px 12px;
  border-top:1px solid var(--line-soft);
}
tfoot td.el{text-align:left; padding-left:12px; font-size:10.5px; font-weight:600; letter-spacing:.01em;
  text-transform:none; white-space:nowrap; color:var(--faint); font-family:"Instrument Sans",sans-serif}
tfoot tr.grand td.el{color:var(--muted); font-weight:700; font-size:11px}
.empty{padding:22px 16px 26px; text-align:center; color:var(--faint); font-size:13.5px; line-height:1.6}

/* ---------- ledger ---------- */
.ledger{list-style:none; margin:0; padding:0}
.ledger li{
  display:flex; align-items:center; gap:9px; padding:11px 12px 11px 14px;
  border-top:1px solid var(--line-soft);
}
.dot{width:9px; height:9px; border-radius:50%; background:var(--suit); flex:none}
.led-name{flex:1; min-width:0; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.badge{
  font-size:9.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase;
  padding:3px 7px; border-radius:5px; flex:none;
}
.badge.rekor{color:var(--good); background:color-mix(in srgb, var(--good) 15%, transparent)}
.badge.ceza{color:var(--bad); background:color-mix(in srgb, var(--bad) 15%, transparent)}
.led-val{font-family:"DM Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums; font-size:14.5px; min-width:50px; text-align:right; flex:none}
.led-del{background:none; border:none; color:var(--faint); font-size:21px; line-height:1; padding:2px 5px; flex:none}

/* ---------- setup ---------- */
.setup{max-width:460px; margin:0 auto; width:100%; display:flex; flex-direction:column; gap:18px; padding-top:2vh}
.setup-hero{text-align:center; display:flex; flex-direction:column; align-items:center; gap:10px}
.hero-mark{width:56px; height:56px; display:grid; place-items:center;
  font-family:"Bricolage Grotesque",sans-serif; font-weight:800; font-size:21px; letter-spacing:-.03em}
.setup-hero h1{font-size:clamp(26px,7.2vw,32px); letter-spacing:-.035em; line-height:1.05}
.setup-hero p{margin:0; color:var(--muted); font-size:13.5px; max-width:32ch}

.modes{display:grid; grid-template-columns:repeat(2,1fr); gap:8px}
.mode-btn{
  display:flex; flex-direction:column; align-items:flex-start; gap:2px;
  padding:12px 14px; border-radius:12px; text-align:left;
  background:var(--surface); border:1px solid var(--line); color:var(--text);
  font-family:"Bricolage Grotesque",sans-serif; font-weight:700; font-size:16px; letter-spacing:-.01em;
}
.mode-btn em{font-family:"Instrument Sans",sans-serif; font-style:normal; font-weight:400; font-size:11.5px; color:var(--faint); letter-spacing:0}
.mode-btn.on{border-color:var(--focus); box-shadow:0 0 0 2px color-mix(in srgb, var(--focus) 26%, transparent)}
.mode-btn.on em{color:var(--muted)}

.names{display:flex; flex-direction:column; gap:8px}
.name-row{display:flex; align-items:center; gap:10px; background:var(--surface);
  border:1px solid var(--line); border-radius:12px; padding:0 12px}
.name-row .idx{
  width:24px; height:24px; flex:none; display:grid; place-items:center; border-radius:7px;
  font-size:11px; font-weight:700; color:var(--suit);
  background:color-mix(in srgb, var(--suit) 16%, transparent);
}
.name-row input{flex:1; min-width:0; background:none; border:none; padding:13px 0; font-size:16px}
.name-row input:focus{outline:none}
.name-row:focus-within{border-color:var(--suit)}
.team-chip{
  flex:none; font-size:9.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
  color:var(--suit); padding:3px 7px; border-radius:5px;
  background:color-mix(in srgb, var(--suit) 14%, transparent);
}
.setup-note{margin:-6px 0 0; font-size:12.5px; color:var(--faint); text-align:center; line-height:1.5}

/* ---------- dağıtan seçici ---------- */
.dealer-block{display:flex; flex-direction:column; gap:7px}
.dealer-label{
  font-size:10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
  color:var(--faint); padding-left:3px;
}
.dealer-label em{font-style:normal; font-weight:400; font-size:11px; letter-spacing:0; text-transform:none; opacity:.85}
.dchips{display:grid; grid-template-columns:repeat(4,1fr); gap:6px}
.dchip{
  padding:11px 3px; font-size:12.5px; font-weight:600; border-radius:10px;
  background:var(--surface); border:1px solid var(--line); color:var(--muted);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.dchip:active{background:var(--surface-2)}
.dchip.on{background:var(--surface-2); border-color:var(--focus); color:var(--text);
  box-shadow:0 0 0 2px color-mix(in srgb, var(--focus) 22%, transparent)}

/* ---------- archive ---------- */
.arch-list{list-style:none; margin:0; padding:0}
.arch-list li{border-top:1px solid var(--line-soft); display:flex; align-items:stretch}
.arch-item{
  flex:1; min-width:0; display:flex; flex-direction:column; gap:4px;
  padding:12px 6px 12px 14px; background:none; border:none; text-align:left; color:inherit;
}
.arch-item:active{background:var(--surface-2)}
.arch-meta{font-size:11px; color:var(--faint); letter-spacing:.01em}
.arch-win{font-size:14.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.arch-win .sc{font-family:"DM Mono",ui-monospace,monospace; font-weight:400; color:var(--muted); padding-left:6px}
.arch-rest{font-size:11.5px; color:var(--faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  font-variant-numeric:tabular-nums}
.arch-del{background:none; border:none; color:var(--faint); font-size:21px; padding:0 14px; flex:none}

.stats-wrap{overflow-x:auto}
.stats{width:100%; border-collapse:collapse; table-layout:auto; min-width:100%}
.stats th{
  padding:7px 8px 9px; font-size:10px; font-weight:700; letter-spacing:.03em; text-transform:uppercase;
  color:var(--faint); border-bottom:1px solid var(--line); white-space:nowrap; text-align:right;
}
.stats th:first-child{text-align:left; padding-left:14px}
.stats td{
  padding:10px 8px; font-size:13.5px; text-align:right; white-space:nowrap;
  border-bottom:1px solid var(--line-soft);
  font-family:"DM Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums; color:var(--muted);
}
.stats td:first-child{
  text-align:left; padding-left:14px; color:var(--text); font-weight:600;
  font-family:"Instrument Sans",sans-serif; max-width:118px; overflow:hidden; text-overflow:ellipsis;
}
.stats tr:last-child td{border-bottom:none}
.stats .win{color:var(--text); font-weight:500}

/* ---------- sheets ---------- */
.backdrop{position:fixed; inset:0; z-index:60; background:rgba(8,14,11,.55)}
.sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:61;
  max-height:92dvh; display:flex; flex-direction:column;
  background:var(--bg); border-top:1px solid var(--line);
  border-radius:20px 20px 0 0; box-shadow:var(--sheet-shadow);
  width:100%; max-width:640px; margin:0 auto;
}
@media (prefers-reduced-motion: no-preference){
  .sheet{animation:rise .22s cubic-bezier(.2,.8,.3,1)}
  .backdrop{animation:fade .22s ease}
}
@keyframes rise{from{transform:translateY(20px); opacity:.5}to{transform:none; opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet-grip{width:38px; height:4px; border-radius:2px; background:var(--line); margin:9px auto 0; flex:none}
.sheet-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; padding:12px 18px 10px; flex:none}
.sheet-head h3{font-size:19px; letter-spacing:-.02em}
.sheet-head .sub{font-size:12.5px; color:var(--faint); white-space:nowrap; flex:none}
.sheet-body{overflow-y:auto; -webkit-overflow-scrolling:touch; padding:2px 16px 10px; display:flex; flex-direction:column; gap:10px}
.sheet-foot{flex:none; padding:10px 16px calc(14px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:8px;
  border-top:1px solid var(--line-soft); background:var(--bg)}

.entry{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:11px 12px 12px; display:flex; flex-direction:column; gap:9px}
.entry.invalid{border-color:var(--bad); box-shadow:0 0 0 3px color-mix(in srgb, var(--bad) 16%, transparent)}
.entry-top{display:flex; align-items:center; gap:9px}
.entry-name{flex:1; min-width:0; font-size:14.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.field{display:flex; align-items:center; background:var(--sunken); border:1px solid var(--line); border-radius:10px; overflow:hidden; flex:none}
.field input{
  width:76px; background:none; border:none; padding:9px 2px; text-align:center;
  font-family:"DM Mono",ui-monospace,monospace; font-size:17px; font-variant-numeric:tabular-nums;
}
.field input:focus{outline:none}
.mini{background:none; border:none; color:var(--text); opacity:.62; width:38px; padding:11px 0; font-size:17px; font-weight:600; line-height:1}
.mini:active{background:var(--surface-2)}
.chips{display:grid; grid-template-columns:repeat(4,1fr); gap:6px}
.chip{
  padding:10px 2px; font-size:13.5px; font-weight:600; border-radius:9px;
  background:var(--surface-2); border:1px solid var(--line); color:var(--text);
  font-family:"DM Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums;
}
.chip:active{background:var(--sunken)}
.chip.on{background:var(--suit); border-color:var(--suit); color:var(--bg)}
.chips.five{grid-template-columns:repeat(5,1fr)}
.chip.dbl{font-family:"Instrument Sans",sans-serif; font-size:13px}
.dbl-note{margin:-2px 2px 0; font-size:12px; color:var(--muted)}
.dbl-note b{font-family:"DM Mono",ui-monospace,monospace; font-weight:500; color:var(--text)}
.x2{font-family:"Instrument Sans",sans-serif; font-size:10px; font-weight:600; color:var(--faint); margin-left:2px}

/* ---------- zar ---------- */
.act-row{display:flex; gap:8px}
.act-row .btn-primary{flex:1; width:auto}
.dice-btn{
  flex:none; display:flex; align-items:center; gap:7px; padding:0 16px;
  border-radius:12px; border:1px solid var(--line); background:var(--surface); color:var(--text);
  font-weight:600; font-size:15px;
}
.dice-btn:active{background:var(--surface-2)}

<script>
(function(){
"use strict";

/* ===================== depolama ===================== */
/* Her buluşma bir "masa"dır: adı, açıldığı gün, biten oyunları ve varsa süren oyunu.
   Masalar hiç silinmez. Eski tek oyunluk kayıtlar ilk açılışta "Önceki oyunlar" masasına taşınır. */
var K_GAME = "okey101.game.v2", K_ARCH = "okey101.arch.v1", K_OLD = "okey101.v1";
var K_TABLES = "okey101.tables.v1", K_ACTIVE = "okey101.active.v1", K_LIVEID = "okey101.liveid";
var mem = {};
function get(k){
  try{ var r = localStorage.getItem(k); return r ? JSON.parse(r) : (mem[k] || null); }
  catch(e){ return mem[k] || null; }
}
function put(k, v){ mem[k] = v; try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

function blankGame(mode, players, firstDealer){
  return { mode: mode || "solo", players: players || ["","","",""],
           hands: [], dealers: [], dbl: [], pl: [], extras: [], seq: 1, started: false,
           firstDealer: firstDealer == null ? 0 : firstDealer, roll: null };
}
/* Eksik alanları tamamlar; eski kayıtlarla ve izleyiciye gelen verilerle de çalışır. */
function normGame(g){
  if(!g || typeof g !== "object") return null;
  if(g.mode !== "team" && g.mode !== "solo") g.mode = "solo";
  if(!Array.isArray(g.players) || g.players.length !== 4) g.players = ["","","",""];
  ["hands", "dealers", "dbl", "pl", "extras"].forEach(function(k){ if(!Array.isArray(g[k])) g[k] = []; });
  while(g.dealers.length < g.hands.length) g.dealers.push(null);   /* eski eller: dağıtan bilinmiyor */
  while(g.dbl.length < g.hands.length) g.dbl.push(null);           /* eski eller: çift değil */
  while(g.pl.length < g.hands.length) g.pl.push(null);             /* eski eşli eller: yalnız eş toplamı */
  if(g.firstDealer == null) g.firstDealer = 0;
  if(!g.seq) g.seq = 1;
  return g;
}
function normTable(t){
  t.name = String(t.name || "Masa");
  t.games = (Array.isArray(t.games) ? t.games : []).map(normGame).filter(Boolean);
  t.cur = t.cur ? normGame(t.cur) : null;
  if(!t.createdAt) t.createdAt = Date.now();
  return t;
}

var TABLES = get(K_TABLES);
if(!Array.isArray(TABLES)){
  TABLES = [];
  var oldG = get(K_GAME), oldA = get(K_ARCH) || [];
  if(!oldG){
    var v1 = get(K_OLD);
    if(v1 && v1.players && v1.players.length === 4)
      oldG = { mode:"solo", players:v1.players.map(String), hands:v1.hands || [], extras:v1.extras || [],
               seq:v1.seq || 1, started:!!v1.started };
  }
  var hasCur = !!(oldG && (oldG.started || (oldG.hands && oldG.hands.length)));
  if(hasCur || oldA.length){
    var first = oldA.reduce(function(m, g){ return g.endedAt && g.endedAt < m ? g.endedAt : m; }, Date.now());
    TABLES.push({ id: get(K_LIVEID) || randomId(), name: "Önceki oyunlar", createdAt: first,
                  games: oldA, cur: hasCur ? oldG : null });
    put(K_ACTIVE, TABLES[0].id);
  }
  put(K_TABLES, TABLES);            /* eski anahtarlar yedek olarak yerinde bırakılır */
}
TABLES = TABLES.filter(function(t){ return t && typeof t === "object" && t.id; }).map(normTable);

function findTable(id){ for(var i=0;i<TABLES.length;i++) if(TABLES[i].id === id) return TABLES[i]; return null; }
var T = findTable(get(K_ACTIVE));          /* açık masa */
var G = T ? T.cur : null;                  /* o masada süren oyun */
var VIEW = T && G && G.started ? "game" : "home";

function saveTables(){ put(K_TABLES, TABLES); }
function saveGame(){ if(T) T.cur = G; saveTables(); scheduleLive(); }
function openTable(t){
  T = t; G = t.cur; put(K_ACTIVE, t.id);
  bindLiveTable(); scheduleLive();
}
function newTable(name){
  var t = normTable({ id: randomId(), name: name, createdAt: Date.now(), games: [], cur: null });
  TABLES.push(t); saveTables();
  return t;
}
function allGames(){
  var out = [];
  TABLES.forEach(function(t){ out = out.concat(t.games); });
  return out;
}
/* Yeni oyun için isim/mod önerisi: bu masanın (yoksa en son masanın) son oyunu. */
function lastGameOf(t){ return t.cur && t.cur.players.some(Boolean) ? t.cur : (t.games.length ? t.games[t.games.length - 1] : null); }
function latestGame(){
  var list = TABLES.slice().sort(function(a, b){ return b.createdAt - a.createdAt; });
  for(var i=0;i<list.length;i++){ var g = lastGameOf(list[i]); if(g) return g; }
  return null;
}
function snapshot(){ return JSON.parse(JSON.stringify({ t:TABLES, a:T ? T.id : null, v:VIEW })); }
function restore(s){
  TABLES = s.t.map(normTable); T = findTable(s.a); G = T ? T.cur : null; VIEW = s.v;
  saveGame(); render();
}

/* ===================== canlı skor ===================== */
/* Skoru tutan cihaz açık masanın tamamını (süren oyun + biten oyunlar) tek bir canlı kayda
   yazar; izleyiciler o kayda abone olup skoru anında görür. Kayıt aynı zamanda masanın
   yedeğidir. İki arka uç var:
   - claude.ai'de açıldığında sayfanın kendi veritabanı (izleyici Claude hesabıyla girer),
   - kendi sitenizde açıldığında Firebase (link herkese açık: ?izle=<masa kodu>). */

/* Firebase konsolu > Proje ayarları > "Web uygulaması" config nesnesi. */
var FIREBASE_CONFIG = {
  apiKey: "AIzaSyDFHObTOeSqQF3UF3eODP_KvH9SL5z_Iow",
  authDomain: "yazboz-42be7.firebaseapp.com",
  databaseURL: "https://yazboz-42be7-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "yazboz-42be7",
  storageBucket: "yazboz-42be7.firebasestorage.app",
  messagingSenderId: "24314590801",
  appId: "1:24314590801:web:d29a8b0e340e5f6144ea70"
};

var FB_VER = "10.12.2";
var IN_CLAUDE = !!(window.claude && typeof window.claude.use === "function");
var WATCH_ID = (function(){
  try{ var m = /[?&]izle=([A-Za-z0-9]{4,40})/.exec(location.search); return m ? m[1] : null; }
  catch(e){ return null; }
})();
var LIVE_URL = IN_CLAUDE ? "https://claude.ai/artifact/Dzi7Sn17d2tT1zKWq9ivP9" : null;
var LIVE_KIND = IN_CLAUDE ? "claude" : (FIREBASE_CONFIG ? "firebase" : null);
var liveRef = null, CAN_WRITE = false, fbRefFor = null;
var LIVE = null, liveLoaded = false;   /* izleyicide: son gelen masa durumu */
var liveState = "off";                 /* off | on | error */
var liveTimer = null, liveBusy = false, livePending = false, liveRetries = 0;

function tablePayload(t){
  return JSON.parse(JSON.stringify({ id:t.id, name:t.name, createdAt:t.createdAt, games:t.games, cur:t.cur }));
}
function livePayload(){ return { table: tablePayload(T), updatedAt: Date.now() }; }
function scheduleLive(){
  if(!liveRef || !CAN_WRITE || !T) return;
  clearTimeout(liveTimer);
  liveTimer = setTimeout(pushLive, 350);
}
function pushLive(){
  if(!T) return;
  if(liveBusy){ livePending = true; return; }
  liveBusy = true;
  liveRef.set(livePayload()).then(function(){
    liveState = "on";
  }, function(e){
    liveState = "error";
    if(e && e.code === "invalid_argument"){
      /* Firebase: kod başka bir cihaza ait (ör. kopyalanmış masa) — masaya yeni kod verilir */
      if(LIVE_KIND === "firebase" && liveRetries < 2){
        liveRetries++; T.id = randomId(); put(K_ACTIVE, T.id); saveTables(); bindLiveTable();
      } else CAN_WRITE = false;
    }
  }).then(function(){
    liveBusy = false;
    if(livePending){ livePending = false; pushLive(); }
  });
}

function withTimeout(p, ms){
  return Promise.race([p, new Promise(function(r){ setTimeout(function(){ r(null); }, ms); })]);
}
function loadScript(src){
  return new Promise(function(ok, fail){
    var s = document.createElement("script");
    s.src = src; s.onload = ok; s.onerror = fail;
    document.head.appendChild(s);
  });
}
function randomId(){
  var abc = "abcdefghjkmnpqrstuvwxyz23456789", out = "";
  try{ var a = new Uint32Array(8); crypto.getRandomValues(a); for(var i=0;i<8;i++) out += abc[a[i] % abc.length]; }
  catch(e){ for(var j=0;j<8;j++) out += abc[Math.floor(Math.random() * abc.length)]; }
  return out;
}
/* Gelen veri masa mı, eski sürümün tek oyunu mu? İkisini de masaya çevirir. */
function toTable(x){
  if(!x) return null;
  if(Array.isArray(x.games)) return normTable(x);
  return normTable({ id: "", name: "", games: [], cur: x });
}

/* ---- claude.ai veritabanı ---- */
function initClaude(){
  return withTimeout(Promise.all([
    window.claude.use("db").catch(function(){ return null; }),
    window.claude.use("user").catch(function(){ return null; })
  ]).then(function(r){
    var db = r[0], user = r[1];
    if(!db) return null;
    var doc = db.doc("live/current");
    liveRef = {
      set: function(p){ return doc.set(p); },
      watch: function(next, err){
        doc.onSnapshot(function(snap){
          var d = snap.exists ? snap.data() : null;
          next(d ? { table: d.table || d.game, updatedAt: d.updatedAt } : null);
        }, err);
      }
    };
    if(!user) return "scorer";
    return user.canEdit().then(function(ok){ return ok ? "scorer" : "watcher"; }, function(){ return "scorer"; });
  }), 4000);
}

/* ---- Firebase Realtime Database ---- */
/* Masa tek bir JSON metni olarak saklanır (Firebase boş dizileri ve null'ları siler). */
function initFirebase(){
  var base = "https://www.gstatic.com/firebasejs/" + FB_VER + "/";
  return loadScript(base + "firebase-app-compat.js")
    .then(function(){ return Promise.all([
      loadScript(base + "firebase-database-compat.js"),
      loadScript(base + "firebase-auth-compat.js") ]); })
    .then(function(){
      var app = firebase.apps.length ? firebase.app() : firebase.initializeApp(FIREBASE_CONFIG);
      var rtdb = app.database();
      fbRefFor = function(id){
        var r = rtdb.ref("games/" + id);
        return {
          set: function(p){
            var u = app.auth().currentUser;
            return r.set({ owner: u ? u.uid : "", data: JSON.stringify(p.table), updatedAt: p.updatedAt })
              .catch(function(e){ throw { code: /permission/i.test(String(e && (e.code || e.message))) ? "invalid_argument" : "unavailable" }; });
          },
          watch: function(next, err){
            r.on("value", function(snap){
              var v = snap.val(), data = null;
              try{ data = v && v.data ? JSON.parse(v.data) : null; }catch(e){}
              next(data ? { table: data, updatedAt: v.updatedAt } : null);
            }, err);
          }
        };
      };
      if(WATCH_ID){ liveRef = fbRefFor(WATCH_ID); return "watcher"; }
      return app.auth().signInAnonymously().then(function(){ return "scorer"; });
    })
    .catch(function(){ liveState = "error"; return null; });
}
/* Firebase'de her masanın kendi kaydı ve linki var; masa değişince bağlantı da değişir. */
function bindLiveTable(){
  if(LIVE_KIND !== "firebase" || !fbRefFor || !T || WATCH_ID) return;
  liveRef = fbRefFor(T.id);
  LIVE_URL = location.origin + location.pathname + "?izle=" + T.id;
  scheduleLive();
}

function initLive(){
  var p = LIVE_KIND === "claude" ? initClaude()
        : LIVE_KIND === "firebase" ? initFirebase()
        : Promise.resolve(null);
  return p.then(function(role){
    if(!role) return;
    if(role === "watcher"){ if(liveRef){ startWatching(); VIEW = "watch"; } return; }
    CAN_WRITE = true; liveState = "on";
    if(LIVE_KIND === "firebase") bindLiveTable();   /* kendi sitemizde: açılışta güncel durumu yay */
  });
}
var lastSeenHands = -1, freshRow = -1;
function startWatching(){
  liveRef.watch(function(d){
    var t = d && d.table ? toTable(JSON.parse(JSON.stringify(d.table))) : null;
    LIVE = t ? { t: t, at: d.updatedAt } : null;
    liveLoaded = true; liveState = "on";
    var n = t && t.cur ? t.cur.hands.length : 0;
    freshRow = (lastSeenHands >= 0 && n > lastSeenHands) ? n - 1 : -1;
    lastSeenHands = n;
    if(VIEW === "watch") render();
  }, function(){ liveState = "error"; if(VIEW === "watch") render(); });
}

/* ===================== yardımcılar ===================== */
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){
  return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]; }); }
function fmt(n){ return n < 0 ? "−" + Math.abs(n) : String(n); }
function plain(n){ return String(n); }

function nEnt(g){ return g.mode === "team" ? 2 : 4; }
function pName(g, i){ var v = (g.players[i] || "").trim(); return v || ((i+1) + ". oyuncu"); }
function entName(g, k){ return g.mode === "team" ? pName(g,k) + " & " + pName(g,k+2) : pName(g,k); }
function entMembers(g, k){ return g.mode === "team" ? [k, k+2] : [k]; }
function teamOf(i){ return i % 2; }                       /* kurulumda 1–3 ve 2–4 eş */

function hSum(g, k){ var t=0; for(var i=0;i<g.hands.length;i++) t += g.hands[i][k]; return t; }
function xSum(g, k){ var t=0; for(var i=0;i<g.extras.length;i++) if(g.extras[i].p===k) t += g.extras[i].v; return t; }
function tot(g, k){ return hSum(g,k) + xSum(g,k); }
function totals(g){ var a=[]; for(var k=0;k<nEnt(g);k++) a.push(tot(g,k)); return a; }
function leaders(g){
  var t = totals(g), m = Math.min.apply(null, t), out = [];
  for(var i=0;i<t.length;i++) if(t[i] === m) out.push(i);
  return out;
}
function modeLabel(g){ return g.mode === "team" ? "Eşli" : "4'lü"; }
function dateLabel(ts){
  try{ return new Date(ts).toLocaleDateString("tr-TR", {day:"numeric", month:"long", year:"numeric"}); }
  catch(e){ return ""; }
}

/* ---- dağıtan ---- */
function dealersOf(g){ return Array.isArray(g.dealers) ? g.dealers : []; }
function nextDealer(g){
  var d = dealersOf(g);
  if(!g.hands.length) return g.firstDealer == null ? 0 : g.firstDealer;
  var last = d[g.hands.length - 1];
  if(last == null) return g.firstDealer == null ? 0 : g.firstDealer;
  return (last + 1) % 4;
}
/* Bir elin dağıtanı değişince sonraki eller sırayla yeniden türetilir. */
function recascade(g, from){
  for(var h = from + 1; h < g.hands.length; h++){
    var prev = g.dealers[h-1];
    g.dealers[h] = prev == null ? null : (prev + 1) % 4;
  }
}

var main = document.getElementById("main");
var topbar = document.getElementById("topbar");
var actionbar = document.getElementById("actionbar");

function render(){
  if(VIEW === "watch"){ renderWatch(); return; }
  if(VIEW === "stats"){ renderStats(); return; }
  if(!T) VIEW = "home";
  if((VIEW === "game" || VIEW === "setup") && !G) VIEW = "table";
  if(VIEW === "game" && !G.started) VIEW = "setup";
  if(VIEW === "home"){ renderHome(); return; }
  if(VIEW === "table"){ renderTable(); return; }
  if(VIEW === "setup"){ renderSetup(); return; }
  renderGame();
}

/* Eşli oyunda her oyuncunun skoru ayrı tutulur (pl); eş sütunu ikisinin toplamıdır. */
function hasSplit(g, r){ return g.mode === "team" && !!(g.pl && g.pl[r]); }
function isDbl(g, r, c){ return !hasSplit(g, r) && !!(g.dbl && g.dbl[r] && g.dbl[r][c]); }
function plDbl(g, r, i){ return hasSplit(g, r) && !!(g.dbl && g.dbl[r] && g.dbl[r][i]); }
function splitText(g, r, k){
  var a = k, b = k + 2, c = '<span class="x2" title="çift">(ç)</span>';
  return fmt(g.pl[r][a]) + (plDbl(g, r, a) ? c : '') + ' + ' + fmt(g.pl[r][b]) + (plDbl(g, r, b) ? c : '');
}

function timeLabel(ts){
  try{ return new Date(ts).toLocaleTimeString("tr-TR", {hour:"2-digit", minute:"2-digit"}); }
  catch(e){ return ""; }
}
function sameDay(a, b){ var x = new Date(a), y = new Date(b); return x.toDateString() === y.toDateString(); }
/* Masanın açıldığı gün oynanan oyunda yalnız saat, başka günse tarih gösterilir. */
function whenLabel(ts, ref){ return ts ? (sameDay(ts, ref) ? timeLabel(ts) : dateLabel(ts)) : ""; }
function defaultTableName(){
  try{ return new Date().toLocaleDateString("tr-TR", {day:"numeric", month:"long", weekday:"long"}); }
  catch(e){ return "Yeni masa"; }
}

/* ---------- istatistikler ---------- */
function normKey(s){ return String(s).trim().toLocaleLowerCase("tr").replace(/\s+/g, " "); }

function computeStats(list){
  var m = {}, order = [];
  function rec(nm){
    var k = normKey(nm);
    if(!m[k]){ m[k] = { name:nm, games:0, wins:0, hands:0, pts:0, rekor:0, best:null }; order.push(k); }
    m[k].name = nm;
    return m[k];
  }
  for(var a=0;a<list.length;a++){
    var g = list[a], win = leaders(g), n = nEnt(g);
    for(var k=0;k<n;k++){
      var mem2 = entMembers(g,k), isWin = win.indexOf(k) >= 0;
      var rekorCount = 0;
      for(var e=0;e<g.extras.length;e++) if(g.extras[e].p === k && g.extras[e].t === "rekor") rekorCount++;
      for(var j=0;j<mem2.length;j++){
        var st = rec(pName(g, mem2[j]));
        st.games++; if(isWin) st.wins++;
        st.rekor += rekorCount;
        for(var h=0;h<g.hands.length;h++){
          var v = hasSplit(g, h) ? g.pl[h][mem2[j]] : g.hands[h][k];   /* eşlide oyuncunun kendi skoru */
          st.hands++; st.pts += v;
          if(st.best === null || v < st.best) st.best = v;
        }
      }
    }
  }
  var arr = order.map(function(k){ return m[k]; });
  arr.sort(function(x,y){ return y.wins - x.wins || y.games - x.games || x.name.localeCompare(y.name, "tr"); });
  return arr;
}

function statsCardHTML(list, title){
  var stats = computeStats(list);
  var h = '<section class="card"><div class="card-head"><h2>' + esc(title) + '</h2>'
        + '<span class="hint">' + (list.length ? list.length + " oyun" : "") + '</span></div>';
  if(!stats.length) return h + '<div class="empty">Henüz biten oyun yok.</div></section>';
  h += '<div class="stats-wrap"><table class="stats"><thead><tr>'
     + '<th>Oyuncu</th><th>Oyun</th><th>Galip</th><th>Ort. el</th><th>Rekor</th><th>En iyi</th>'
     + '</tr></thead><tbody>';
  for(var i=0;i<stats.length;i++){
    var s = stats[i];
    var avg = s.hands ? Math.round(s.pts / s.hands) : null;
    h += '<tr><td>' + esc(s.name) + '</td>'
       +   '<td>' + s.games + '</td>'
       +   '<td class="win">' + s.wins + '</td>'
       +   '<td>' + (avg === null ? "·" : fmt(avg)) + '</td>'
       +   '<td>' + (s.rekor || "·") + '</td>'
       +   '<td>' + (s.best === null ? "·" : fmt(s.best)) + '</td></tr>';
  }
  return h + '</tbody></table></div></section>';
}

var overlay = document.getElementById("overlay");
var onEsc = null;

function openSheet(inner, onOpen){
  overlay.innerHTML = '<div class="backdrop" data-close></div>'
    + '<div class="sheet" role="dialog" aria-modal="true"><div class="sheet-grip"></div>' + inner + '</div>';
  overlay.querySelector("[data-close]").addEventListener("click", closeSheet);
  onEsc = function(e){ if(e.key === "Escape") closeSheet(); };
  document.addEventListener("keydown", onEsc);
  if(onOpen) onOpen(overlay.querySelector(".sheet"));
}
function closeSheet(){
  overlay.innerHTML = "";
  if(onEsc){ document.removeEventListener("keydown", onEsc); onEsc = null; }
}

function parseVal(raw){
  var s = String(raw).trim().replace(/−/g, "-").replace(/\s/g, "");
  if(s === "" || s === "-") return null;
  if(!/^-?\d{1,6}$/.test(s)) return null;
  return parseInt(s, 10);
}
function sanitize(el){
  el.value = el.value.replace(/[^\d-]/g, "").replace(/(?!^)-/g, "").slice(0, 7);
}

/* ---------- el girişi ---------- */
var QUICK = [-101, -202, 101, 202];

/* Her elde dört oyuncunun skoru ayrı girilir. 4'lüde her oyuncu kendi sütunudur;
   eşlide oyuncular eşleriyle alt alta durur, eş sütununa ikisinin toplamı yazılır. */
function openHandSheet(editIdx){
  var isEdit = editIdx != null;
  var team = G.mode === "team";
  var order = team ? [0, 2, 1, 3] : [0, 1, 2, 3];
  var no = isEdit ? editIdx + 1 : G.hands.length + 1;
  var dealer = isEdit ? G.dealers[editIdx] : nextDealer(G);
  if(dealer == null) dealer = nextDealer(G);

  /* düzeltmede her oyuncunun girdiği taban puan (çiftse yarısı) gösterilir */
  var base = [null, null, null, null], dflag = [false, false, false, false];
  if(isEdit){
    for(var p=0;p<4;p++){
      var raw, d;
      if(!team){ raw = G.hands[editIdx][p]; d = isDbl(G, editIdx, p); }
      else if(hasSplit(G, editIdx)){ raw = G.pl[editIdx][p]; d = plDbl(G, editIdx, p); }
      else { raw = p < 2 ? G.hands[editIdx][p] : 0; d = p < 2 && isDbl(G, editIdx, p); }   /* eski el: eş toplamı ilk oyuncuda */
      dflag[p] = !!d; base[p] = d ? raw / 2 : raw;
    }
  }

  var body = '<div class="dealer-block"><span class="dealer-label">Bu eli kim dağıttı?</span>'
           + dealerChipsHTML(dealer) + '</div>';
  for(var i=0;i<4;i++){
    var pi = order[i], suit = team ? teamOf(pi) : pi, v = base[pi], dbl = dflag[pi];
    if(team && i % 2 === 0){
      body += '<div class="team-head" style="--suit:var(--suit-' + suit + ')">'
            +   '<span>' + esc(entName(G, suit)) + '</span><span>eş toplamı <b data-tsum="' + suit + '">–</b></span></div>';
    }
    body += '<div class="entry" data-p="' + pi + '" data-dbl="' + (dbl ? 1 : 0) + '" style="--suit:var(--suit-' + suit + ')">'
          +   '<div class="entry-top">'
          +     '<span class="dot"></span>'
          +     '<span class="entry-name">' + esc(pName(G, pi)) + '</span>'
          +     '<div class="field">'
          +       '<button class="mini" data-act="sign" aria-label="Artı eksi">&plusmn;</button>'
          +       '<input class="ein" type="text" inputmode="numeric" pattern="-?[0-9]*" placeholder="0" value="' + (v === null || v === undefined ? "" : v) + '" aria-label="' + esc(pName(G, pi)) + ' skoru">'
          +       '<button class="mini" data-act="clear" aria-label="Temizle">&times;</button>'
          +     '</div>'
          +   '</div>'
          +   '<div class="chips five">'
          +     QUICK.map(function(q){
                  return '<button class="chip' + (v === q ? " on" : "") + '" data-q="' + q + '">' + fmt(q) + '</button>';
                }).join("")
          +     '<button class="chip dbl' + (dbl ? " on" : "") + '" aria-pressed="' + dbl + '" aria-label="Çift: puanı iki katına çıkar">Çift</button>'
          +   '</div>'
          +   '<p class="dbl-note"' + (dbl ? '' : ' hidden') + '>Çift · yazılacak puan <b>–</b></p>'
          + '</div>';
  }

  var inner = '<div class="sheet-head"><h3>' + no + '. El' + (isEdit ? " · düzelt" : "") + '</h3>'
            +   '<span class="sub">4 skorun tamamı gerekli</span></div>'
            + '<div class="sheet-body">' + body
            +   '<div class="sheet-note"><span>El toplamı</span><b id="hsum">–</b></div></div>'
            + '<div class="sheet-foot">'
            +   '<p class="err" id="err" hidden>Kaydetmek için dört oyuncunun da skorunu girin.</p>'
            +   '<button class="btn-primary tile" id="saveHand">' + (isEdit ? "Değişikliği Kaydet" : "Eli Kaydet") + '</button>'
            +   (isEdit ? '<button class="sbtn danger" id="delHand">Bu Eli Sil</button>' : "")
            + '</div>';

  openSheet(inner, function(sheet){
    var ins = sheet.querySelectorAll(".ein");
    var err = sheet.querySelector("#err");
    var hsum = sheet.querySelector("#hsum");
    var pickedDealer = dealer;

    function entryOf(i){ return ins[i].parentNode.parentNode.parentNode; }
    function playerOf(i){ return Number(entryOf(i).getAttribute("data-p")); }
    function dblOf(i){ return entryOf(i).getAttribute("data-dbl") === "1"; }
    function effVal(i){                               /* çift seçiliyse yazılan puanın 2 katı */
      var p = parseVal(ins[i].value);
      return p === null ? null : (dblOf(i) ? p * 2 : p);
    }

    function refresh(){
      var t = 0, ok = true, ts = [0, 0], tok = [true, true];
      for(var i=0;i<ins.length;i++){
        var p = parseVal(ins[i].value), ev = effVal(i), k = teamOf(playerOf(i));
        if(ev === null){ ok = false; tok[k] = false; } else { t += ev; ts[k] += ev; }
        var entry = entryOf(i), on = dblOf(i);
        var chips = entry.querySelectorAll(".chip[data-q]");
        for(var c=0;c<chips.length;c++)
          chips[c].classList.toggle("on", p !== null && p === Number(chips[c].getAttribute("data-q")));
        var db = entry.querySelector(".chip.dbl");
        db.classList.toggle("on", on); db.setAttribute("aria-pressed", String(on));
        var note = entry.querySelector(".dbl-note");
        note.hidden = !on;
        note.querySelector("b").textContent = ev === null ? "–" : fmt(ev);
      }
      var tb = sheet.querySelectorAll("[data-tsum]");
      for(var j=0;j<tb.length;j++){
        var kk = Number(tb[j].getAttribute("data-tsum"));
        tb[j].textContent = tok[kk] ? fmt(ts[kk]) : "–";
      }
      hsum.textContent = ok ? fmt(t) : "–";
    }

    sheet.addEventListener("click", function(e){
      var dbx = e.target.closest(".chip.dbl");
      if(dbx){
        var en = dbx.parentNode.parentNode;
        en.setAttribute("data-dbl", en.getAttribute("data-dbl") === "1" ? "0" : "1");
        refresh(); return;
      }
      var dc = e.target.closest(".dchip");
      if(dc){
        pickedDealer = Number(dc.getAttribute("data-d"));
        var all = sheet.querySelectorAll(".dchip");
        for(var j=0;j<all.length;j++)
          all[j].classList.toggle("on", Number(all[j].getAttribute("data-d")) === pickedDealer);
        return;
      }
      var chip = e.target.closest(".chip");
      if(chip){
        var inp = chip.parentNode.parentNode.querySelector(".ein");
        inp.value = chip.getAttribute("data-q");
        chip.parentNode.parentNode.classList.remove("invalid");
        err.hidden = true; refresh(); return;
      }
      var mini = e.target.closest(".mini");
      if(mini){
        var f = mini.parentNode.querySelector(".ein");
        if(mini.getAttribute("data-act") === "clear"){ f.value = ""; }
        else { var p = parseVal(f.value); f.value = (p === null) ? "-" : String(-p); }
        err.hidden = true; refresh(); return;
      }
    });

    sheet.addEventListener("input", function(e){
      if(!e.target.classList.contains("ein")) return;
      sanitize(e.target);
      e.target.parentNode.parentNode.parentNode.classList.remove("invalid");
      err.hidden = true; refresh();
    });

    sheet.querySelector("#saveHand").addEventListener("click", function(){
      var byP = [0, 0, 0, 0], flags = [false, false, false, false], anyDbl = false, bad = false;
      for(var i=0;i<ins.length;i++){
        var ev = effVal(i), pi = playerOf(i);
        if(ev === null){ entryOf(i).classList.add("invalid"); bad = true; }
        byP[pi] = ev;
        flags[pi] = dblOf(i); if(flags[pi]) anyDbl = true;
      }
      if(bad){
        err.hidden = false;
        var first = sheet.querySelector(".entry.invalid .ein");
        if(first) first.focus();
        return;
      }
      var row = team ? [byP[0] + byP[2], byP[1] + byP[3]] : byP;
      var plRow = team ? byP : null;
      var dflags = anyDbl ? flags : null;
      if(isEdit){
        G.hands[editIdx] = row;
        G.pl[editIdx] = plRow;
        G.dbl[editIdx] = dflags;
        G.dealers[editIdx] = pickedDealer;
        recascade(G, editIdx);                       /* sonraki ellerin dağıtanı kayar */
        if(editIdx === 0) G.firstDealer = pickedDealer;
      } else {
        G.hands.push(row);
        G.pl.push(plRow);
        G.dbl.push(dflags);
        G.dealers.push(pickedDealer);
        if(G.hands.length === 1) G.firstDealer = pickedDealer;
      }
      saveGame(); closeSheet(); render();
    });

    var del = sheet.querySelector("#delHand");
    if(del) del.addEventListener("click", function(){
      var snap = snapshot();
      G.hands.splice(editIdx, 1);
      G.dealers.splice(editIdx, 1);
      G.dbl.splice(editIdx, 1);
      G.pl.splice(editIdx, 1);
      for(var i=0;i<G.extras.length;i++)               /* rekor/ceza el konumları kaysın */
        if(G.extras[i].h != null && G.extras[i].h > editIdx) G.extras[i].h--;
      saveGame(); closeSheet(); render();
      toast(no + ". el silindi", snap);
    });

    refresh();
  });
}

/* ---------- paylaşma ---------- */
function shareText(g){
  var n = nEnt(g), d = dealersOf(g), L = [];
  L.push("🀄 Okey 101 Yaz Boz");
  L.push(dateLabel(g.endedAt || Date.now()) + " · " + modeLabel(g) + " · " + g.hands.length + " el");
  L.push("");

  var order = [];
  for(var k=0;k<n;k++) order.push(k);
  order.sort(function(a,b){ return tot(g,a) - tot(g,b); });
  for(var i=0;i<order.length;i++){
    var e = order[i];
    L.push((i === 0 ? "🏆 " : "   ") + (i+1) + ". " + entName(g,e) + " — " + plain(tot(g,e)));
  }

  var names = [];
  for(var c=0;c<n;c++) names.push(entName(g,c));

  if(g.hands.length){
    L.push(""); L.push("El skorları (" + names.join(" / ") + ")");
    for(var h=0;h<g.hands.length;h++){
      var dl = d[h] == null ? "" : "  [" + pName(g, d[h]) + " dağıttı]";
      L.push((h+1) + ". el — " + g.hands[h].map(function(v, c){
        var s = plain(v) + (isDbl(g, h, c) ? " (çift)" : "");
        if(hasSplit(g, h)) s += " (" + plain(g.pl[h][c]) + (plDbl(g, h, c) ? "ç" : "") + " + " + plain(g.pl[h][c+2]) + (plDbl(g, h, c+2) ? "ç" : "") + ")";
        return s;
      }).join(" / ") + dl);
    }
    L.push("El toplamı — " + names.map(function(_, j){ return plain(hSum(g,j)); }).join(" / "));
  }
  if(g.extras.length){
    L.push(""); L.push("Rekor ve cezalar");
    for(var x=0;x<g.extras.length;x++){
      var ex = g.extras[x];
      L.push(entName(g, ex.p) + " — " + (ex.t === "rekor" ? "Rekor" : "Ceza") + " " + plain(ex.v));
    }
  }
  return L.join("\n");
}

function shareGame(g){
  var txt = shareText(g);
  if(navigator.share){
    try{
      navigator.share({ text: txt }).catch(function(err){
        if(!err || err.name !== "AbortError") copyOrShow(txt);   /* iptal edildiyse sessiz kal */
      });
      return;
    }catch(e){}
  }
  copyOrShow(txt);
}

function copyOrShow(txt){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(
      function(){ toast("Skor tablosu kopyalandı"); },
      function(){ openTextSheet(txt); });
    return;
  }
  openTextSheet(txt);
}

function openTextSheet(txt){
  var inner = '<div class="sheet-head"><h3>Sonucu Paylaş</h3><span class="sub">seçip kopyalayın</span></div>'
            + '<div class="sheet-body"><p class="desc">Metni seçip kopyalayın, sonra sohbete yapıştırın.</p>'
            +   '<textarea class="share-box" id="shareBox" readonly spellcheck="false"></textarea></div>'
            + '<div class="sheet-foot"><button class="btn-primary tile" id="copyBtn">Tümünü Seç</button>'
            +   '<button class="sbtn" id="closeShare">Kapat</button></div>';
  openSheet(inner, function(sheet){
    var box = sheet.querySelector("#shareBox");
    box.value = txt;
    sheet.querySelector("#closeShare").addEventListener("click", closeSheet);
    sheet.querySelector("#copyBtn").addEventListener("click", function(){
      box.focus(); box.setSelectionRange(0, box.value.length);
      try{ if(document.execCommand("copy")) toast("Kopyalandı"); }catch(e){}
    });
  });
}

/* ---------- menü ---------- */
var RESET_LABEL = "Bu Oyunu Sıfırla";

function openMenu(){
  var canEnd = G.hands.length > 0 || G.extras.length > 0;
  var inner = '<div class="sheet-head"><h3>Seçenekler</h3><span class="sub">' + esc(T.name) + '</span></div>'
            + '<div class="sheet-body"><div class="menu-list">'
            +   '<button class="sbtn" data-m="live">Canlı Skor Linki</button>'
            +   '<button class="sbtn" data-m="share">Sonucu Paylaş</button>'
            +   '<button class="sbtn" data-m="names">Oyuncu İsimlerini Düzenle</button>'
            +   '<button class="sbtn" data-m="undoLast"' + (G.hands.length ? "" : " disabled") + '>Son Eli Sil</button>'
            +   '<button class="sbtn" data-m="finish"' + (canEnd ? "" : " disabled") + '>Oyunu Bitir ve Masaya Kaydet</button>'
            +   '<button class="sbtn" data-m="table">Masaya Dön</button>'
            +   '<button class="sbtn danger" data-m="reset">' + RESET_LABEL + '</button>'
            + '</div></div>'
            + '<div class="sheet-foot"><button class="sbtn" id="closeMenu">Kapat</button></div>';

  openSheet(inner, function(sheet){
    sheet.querySelector("#closeMenu").addEventListener("click", closeSheet);
    sheet.addEventListener("click", function(e){
      var b = e.target.closest("[data-m]");
      if(!b || b.disabled) return;
      var m = b.getAttribute("data-m");

      if(m === "live"){ closeSheet(); openLiveSheet(); return; }
      if(m === "share"){ closeSheet(); shareGame(G); return; }
      if(m === "names"){ closeSheet(); openNamesSheet(); return; }
      if(m === "table"){ closeSheet(); go("table"); return; }

      if(m === "undoLast"){
        var snap = snapshot(), no = G.hands.length;
        G.hands.pop(); G.dealers.pop(); G.dbl.pop(); G.pl.pop();
        for(var i=0;i<G.extras.length;i++)
          if(G.extras[i].h != null && G.extras[i].h > no - 1) G.extras[i].h = no - 1;
        saveGame(); closeSheet(); render();
        toast(no + ". el silindi", snap);
        return;
      }

      if(m === "finish"){
        var snap2 = snapshot();
        var done = JSON.parse(JSON.stringify({
          mode:G.mode, players:G.players, hands:G.hands, dealers:G.dealers, dbl:G.dbl, pl:G.pl, extras:G.extras
        }));
        done.endedAt = Date.now();
        T.games.push(done);
        var win = leaders(done);
        G = blankGame(G.mode, G.players.slice(), nextDealer(G));   /* rövanşta sıra devam eder */
        saveGame(); closeSheet(); go("table");
        toast("Masaya kaydedildi · " + entName(done, win[0]) + " kazandı", snap2);
        return;
      }

      if(m === "reset"){
        if(b.getAttribute("data-armed")){
          var snap3 = snapshot();
          G = blankGame(G.mode, G.players.slice(), G.firstDealer);
          saveGame(); closeSheet(); go("setup");
          toast("Oyun sıfırlandı", snap3);
        } else {
          b.setAttribute("data-armed", "1");
          b.textContent = "Emin misiniz? Tekrar dokunun";
          setTimeout(function(){
            if(b.isConnected){ b.removeAttribute("data-armed"); b.textContent = RESET_LABEL; }
          }, 3500);
        }
      }
    });
  });
}

  openSheet(inner, function(sheet){
    var inp = sheet.querySelector("#tname");
    function save(){ onSave(inp.value.trim() || defaultTableName()); }
    sheet.querySelector("#saveTname").addEventListener("click", save);
    inp.addEventListener("keydown", function(e){ if(e.key === "Enter"){ e.preventDefault(); save(); } });
    setTimeout(function(){ try{ inp.focus(); inp.select(); }catch(e){} }, 60);
  });
}
function openNewTableSheet(){
  tableNameSheet("Yeni Masa", defaultTableName(), "Masayı Aç", function(name){
    var last = latestGame(), t = newTable(name);
    openTable(t);
    G = blankGame(last ? last.mode : "solo", last ? last.players.slice() : null, 0);
    saveGame(); closeSheet(); go("setup");
  });
}
function openRenameSheet(){
  tableNameSheet("Masa Adı", T.name, "Kaydet", function(name){
    T.name = name; saveGame(); closeSheet(); render();
  });
}

function openNamesSheet(){
  var team = G.mode === "team";
  var body = "";
  for(var i=0;i<4;i++){
    var suit = team ? teamOf(i) : i;
    body += '<label class="name-row" style="--suit:var(--suit-' + suit + ')">'
          +   '<span class="idx">' + (i+1) + '</span>'
          +   '<input type="text" class="nin" value="' + esc(G.players[i] || "") + '" placeholder="' + (i+1) + '. oyuncu" autocomplete="off" autocapitalize="words" spellcheck="false">'
          +   (team ? '<span class="team-chip">' + (teamOf(i) + 1) + '. eş</span>' : "")
          + '</label>';
  }
  var inner = '<div class="sheet-head"><h3>Oyuncu İsimleri</h3><span class="sub">' + modeLabel(G) + '</span></div>'
            + '<div class="sheet-body">' + body + '</div>'
            + '<div class="sheet-foot"><button class="btn-primary tile" id="saveNames">Kaydet</button></div>';

  openSheet(inner, function(sheet){
    sheet.querySelector("#saveNames").addEventListener("click", function(){
      var ins = sheet.querySelectorAll(".nin");
      for(var i=0;i<4;i++){
        var v = ins[i].value.trim();
        G.players[i] = v || ((i+1) + ". oyuncu");
      }
      saveGame(); closeSheet(); render();
    });
  });
}

/* ---------- canlı skor linki ---------- */
function openLiveSheet(){
  var ready = !!liveRef && CAN_WRITE && !!LIVE_URL;
  var note = LIVE_KIND === "claude"
    ? "İzleyicinin linki açabilmesi için sayfanın <b>Paylaş</b> menüsünden onu eklemeniz gerekir. Herkese açık link için uygulamanın kendi sitenizdeki sürümünü kullanın."
    : "Link herkese açıktır; açan kişinin hesap açması gerekmez. İzleyiciler skoru yalnızca görür, değiştiremez.";
  var inner = '<div class="sheet-head"><h3>Canlı Skor Linki</h3>'
            +   '<span class="live-chip' + (ready && liveState !== "error" ? "" : " off") + '">'
            +     (ready ? (liveState === "error" ? "Hata" : "Yayında") : "Kapalı") + '</span></div>'
            + '<div class="sheet-body">'
            +   '<p class="desc">' + (ready
                  ? "<b>" + esc(T ? T.name : "") + "</b> masasının linki. Açan kişi süren oyunu ve bu masada biten bütün oyunları görür; el, rekor veya ceza girdiğiniz anda ekranı güncellenir."
                  : (LIVE_KIND ? "Canlı yayına bağlanılamadı. İnternet bağlantınızı kontrol edip sayfayı yenileyin."
                               : "Canlı yayın ayarlanmamış (Firebase bilgileri eksik). Skorlar yalnızca bu cihazda tutuluyor.")) + '</p>'
            +   (ready ? '<span class="link-box" id="liveLink">' + esc(LIVE_URL) + '</span>'
                       + '<p class="desc">' + note + '</p>' : '')
            + '</div>'
            + '<div class="sheet-foot">' + (ready ? '<button class="btn-primary tile" id="copyLive">Linki Kopyala</button>' : '')
            +   '<button class="sbtn" id="closeLive">Kapat</button></div>';
  openSheet(inner, function(sheet){
    sheet.querySelector("#closeLive").addEventListener("click", closeSheet);
    var copyBtn = sheet.querySelector("#copyLive");
    if(copyBtn) copyBtn.addEventListener("click", function(){
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(LIVE_URL).then(function(){ toast("Link kopyalandı"); }, selectLink);
      } else selectLink();
    });
    function selectLink(){
      var r = document.createRange(); r.selectNodeContents(sheet.querySelector("#liveLink"));
      var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
      toast("Linki seçip kopyalayın");
    }
  });
}

/* ---------- zar ---------- */
var PIPS = { 1:[4], 2:[0,8], 3:[0,4,8], 4:[0,2,6,8], 5:[0,2,4,6,8], 6:[0,2,3,5,6,8] };
function dieHTML(v, small){
  var on = PIPS[v] || [], h = '<div class="die tile' + (small ? " small" : "") + '" role="img" aria-label="' + v + '">';
  for(var i=0;i<9;i++) h += '<i' + (on.indexOf(i) >= 0 ? ' class="on"' : '') + '></i>';
  return h + '</div>';
}
function rand6(){
  try{ var a = new Uint32Array(1); crypto.getRandomValues(a); return (a[0] % 6) + 1; }
  catch(e){ return Math.floor(Math.random() * 6) + 1; }
}

function openDiceSheet(){
  var inner = '<div class="sheet-head"><h3>Zar At</h3><span class="sub">iki zar</span></div>'
            + '<div class="sheet-body">'
            +   '<div class="dice-row" id="diceRow" aria-live="polite">' + dieHTML(1) + dieHTML(1) + '</div>'
            +   '<div class="dice-sum" id="diceSum">&nbsp;<em></em></div>'
            + '</div>'
            + '<div class="sheet-foot"><button class="btn-primary tile" id="rollAgain">Tekrar At</button>'
            +   '<button class="sbtn" id="closeDice">Kapat</button></div>';
  openSheet(inner, function(sheet){
    var row = sheet.querySelector("#diceRow"), sum = sheet.querySelector("#diceSum");
    var again = sheet.querySelector("#rollAgain"), timer = null;
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    function roll(){
      clearInterval(timer);
      var a = rand6(), b = rand6(), ticks = reduce ? 0 : 9;
      again.disabled = true;
      sum.innerHTML = '&nbsp;<em></em>';
      function finish(){
        row.innerHTML = dieHTML(a) + dieHTML(b);
        sum.innerHTML = '<em>' + (a === b ? "Çift geldi" : "") + '</em>';
        again.disabled = false;
        if(G.started){ G.roll = { d:[a, b], at: Date.now() }; saveGame(); }   /* izleyiciler de görsün */
      }
      if(!ticks){ finish(); return; }
      timer = setInterval(function(){
        if(!sheet.isConnected){ clearInterval(timer); return; }
        if(--ticks <= 0){ clearInterval(timer); finish(); return; }
        row.innerHTML = dieHTML(rand6()).replace('class="die', 'class="die rolling')
                      + dieHTML(rand6()).replace('class="die', 'class="die rolling');
      }, 70);
    }
    again.addEventListener("click", roll);
    sheet.querySelector("#closeDice").addEventListener("click", closeSheet);
    roll();
  });
}

/* ---------- oyun detayı ---------- */
function openGameSheet(g){
  var win = leaders(g);
  var inner = '<div class="sheet-head"><h3>' + esc(dateLabel(g.endedAt)) + '</h3>'
            +   '<span class="sub">' + esc(timeLabel(g.endedAt)) + ' · ' + modeLabel(g) + ' · ' + g.hands.length + ' el</span></div>'
            + '<div class="sheet-body">'
            +   '<p class="desc">🏆 <b>' + esc(entName(g, win[0])) + '</b> kazandı · ' + fmt(tot(g, win[0])) + '</p>'
            +   standingsHTML(g) + tableCardHTML(g, false)
            +   ledgerHTML(g, false)
            + '</div>'
            + '<div class="sheet-foot"><button class="btn-primary tile" id="shareOld">Sonucu Paylaş</button>'
            +   '<button class="sbtn" id="closeGame">Kapat</button></div>';
  openSheet(inner, function(sheet){
    sheet.querySelector("#closeGame").addEventListener("click", closeSheet);
    sheet.querySelector("#shareOld").addEventListener("click", function(){ closeSheet(); shareGame(g); });
  });
}

/* ---------- geri al bildirimi ---------- */
var toastRoot = document.getElementById("toastRoot");
var toastTimer = null;
function toast(msg, snap){
  clearTimeout(toastTimer);
  toastRoot.innerHTML = '<div class="toast"><span>' + esc(msg) + '</span>'
    + (snap ? '<button type="button">Geri al</button>' : "") + '</div>';
  var btn = toastRoot.querySelector("button");
  if(btn) btn.addEventListener("click", function(){
    clearTimeout(toastTimer); toastRoot.innerHTML = ""; restore(snap);
  });
  toastTimer = setTimeout(function(){ toastRoot.innerHTML = ""; }, 5500);
}


/* ===================== bağlantılar ===================== */
document.getElementById("newHandBtn").addEventListener("click", function(){ openHandSheet(null); });
document.getElementById("diceBtn").addEventListener("click", openDiceSheet);

main.addEventListener("click", function(e){
  var add = e.target.closest("[data-add]");
  if(add){ openExtraSheet(add.getAttribute("data-add")); return; }

  var del = e.target.closest("[data-del]");
  if(del){
    var id = Number(del.getAttribute("data-del")), snap = snapshot();
    G.extras = G.extras.filter(function(x){ return x.id !== id; });
    saveGame(); render(); toast("Kayıt silindi", snap);
    return;
  }

  var row = e.target.closest("[data-hand]");
  if(row){ openHandSheet(Number(row.getAttribute("data-hand"))); return; }

  var tb = e.target.closest("[data-table]");
  if(tb){
    var t = findTable(tb.getAttribute("data-table"));
    if(t){ openTable(t); go("table"); }
    return;
  }

  var gm = e.target.closest("[data-game]");
  if(gm){
    var list = gm.getAttribute("data-src") === "w" ? (LIVE && LIVE.t ? LIVE.t.games : []) : (T ? T.games : []);
    var g = list[Number(gm.getAttribute("data-game"))];
    if(g) openGameSheet(g);
    return;
  }

  var dg = e.target.closest("[data-delgame]");
  if(dg){
    var gi = Number(dg.getAttribute("data-delgame")), snap2 = snapshot();
    T.games.splice(gi, 1); saveGame(); render();
    toast("Oyun masadan silindi", snap2);
  }
});

/* kurulumda isim yazılırken dağıtan çipleri adı takip etsin */
main.addEventListener("input", function(e){
  if(VIEW !== "setup" || !e.target.id || e.target.id.indexOf("nm") !== 0) return;
  var i = Number(e.target.id.slice(2));
  G.players[i] = e.target.value;
  var chip = main.querySelector('.dchip[data-d="' + i + '"]');
  if(chip) chip.textContent = pName(G, i);
});

main.addEventListener("keydown", function(e){
  if(e.key !== "Enter" && e.key !== " ") return;
  var row = e.target.closest("[data-hand]");
  if(row){ e.preventDefault(); openHandSheet(Number(row.getAttribute("data-hand"))); }
});

} else {
